[project]
name = "chatbot-ai-api"
version = "0.1.0"
description = "Motor de chatbot multi-tenant: RAG, canales y orquestacion del LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "pypdf>=6.14.2",
    "cryptography>=50.0.0",
    "sentry-sdk[fastapi]>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Las revisiones las escribe --autogenerate. Formatearlas a mano genera ruido en
# los diffs y no aporta nada. alembic/env.py SI se lintea (ese lo escribimos nosotros).
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
